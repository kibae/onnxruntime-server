name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '18 0 * * 3'

jobs:
  analyze:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'documentation') }}
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare container(onnxruntime)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/actions/download-onnxruntime-linux.sh

      - name: Prepare container(onnxruntime)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake boost openssl googletest onnxruntime

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build with pinned ONNX Runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libgtest-dev
          mkdir -p "$RUNNER_TEMP/no-pkgconfig"
          PKG_CONFIG_PATH="" PKG_CONFIG_LIBDIR="$RUNNER_TEMP/no-pkgconfig" \
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Release \
            -DONNX_RUNTIME_WITH_CUDA_PROVIDER=OFF \
            -DONNX_RUNTIME_INCLUDE_DIRS=/usr/local/onnxruntime/include \
            -DONNX_RUNTIME_LIBRARY=/usr/local/onnxruntime/lib/libonnxruntime.so \
            -DONNX_RUNTIME_LIBRARY_DIRS=/usr/local/onnxruntime/lib \
            -DONNX_RUNTIME_LIBRARIES=/usr/local/onnxruntime/lib/libonnxruntime.so
          cmake --build build-codeql --parallel 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
